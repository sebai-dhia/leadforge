services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: leadfinder
      POSTGRES_USER: leadfinder
      POSTGRES_PASSWORD: leadfinder
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  # n8n keeps its workflows, credentials and executions in its own Postgres, not in SQLite.
  n8n-db:
    image: postgres:17
    environment:
      POSTGRES_DB: n8n
      POSTGRES_USER: n8n
      POSTGRES_PASSWORD: ${N8N_DB_PASSWORD:-n8n-local-only}
    ports:
      # only for running n8n outside Docker on this machine (tools/n8n-local.sh)
      - "127.0.0.1:5434:5432"
    volumes:
      - n8n_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U n8n -d n8n"]
      interval: 5s
      timeout: 5s
      retries: 10

  n8n:
    image: n8nio/n8n:2.43.8
    depends_on:
      n8n-db:
        condition: service_healthy
    ports:
      - "5678:5678"
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: n8n-db
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: n8n
      DB_POSTGRESDB_PASSWORD: ${N8N_DB_PASSWORD:-n8n-local-only}
      DB_POSTGRESDB_CONNECTION_TIMEOUT: "60000"
      # Encrypts the stored credentials (API keys). Keep it secret and never change it, or the credentials become unreadable.
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?Set N8N_ENCRYPTION_KEY in app/.env (see .env.example)}
      WEBHOOK_URL: ${N8N_WEBHOOK_BASE:-http://localhost:5678/}
      N8N_SECURE_COOKIE: ${N8N_SECURE_COOKIE:-false}
      GENERIC_TIMEZONE: Africa/Tunis
      TZ: Africa/Tunis
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "true"
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: "336"
    extra_hosts:
      # the workflows post their results back to the backend running on this machine
      - "host.docker.internal:host-gateway"
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n:/workflows:ro
    restart: unless-stopped

volumes:
  pgdata:
  n8n_pgdata:
  n8n_data:
