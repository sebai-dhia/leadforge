spring.application.name=backend
# Local secrets: app/.env (git-ignored) is read when it exists. Real environment variables still win.
spring.config.import=optional:file:../.env[.properties],optional:file:.env[.properties]
server.port=${PORT:8081}
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/leadfinder}
spring.datasource.username=${DB_USER:leadfinder}
spring.datasource.password=${DB_PASSWORD:leadfinder}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Must be at least 32 characters. Override in production.
app.jwt-secret=${JWT_SECRET:dev-only-secret-change-me-please-32chars}
app.cors-origin=${CORS_ORIGIN:http://localhost:4200}
app.n8n.webhook-url=${N8N_WEBHOOK_URL:http://localhost:5678/webhook/find-leads}
app.n8n.draft-url=${N8N_DRAFT_URL:http://localhost:5678/webhook/draft-message}
app.n8n.webhook-secret=${N8N_WEBHOOK_SECRET:dev-webhook-secret}
app.n8n.callback-secret=${N8N_CALLBACK_SECRET:dev-callback-secret}
# URL n8n uses to reach this backend (host.docker.internal if n8n runs in Docker)
app.public-base-url=${PUBLIC_BASE_URL:http://localhost:8081}

app.n8n.enrich-url=${N8N_ENRICH_URL:http://localhost:5678/webhook/enrich-contact}

# Usage limits. Daily limits are per user over a rolling 24 hours.
app.limits.searches-per-day=${LIMIT_SEARCHES_PER_DAY:20}
app.limits.drafts-per-day=${LIMIT_DRAFTS_PER_DAY:100}
app.limits.enrich-per-day=${LIMIT_ENRICH_PER_DAY:50}
# After this many failed logins from one address (or one address and email) the address is blocked for the window.
app.limits.login-failures=${LIMIT_LOGIN_FAILURES:5}
app.limits.login-window-minutes=${LIMIT_LOGIN_WINDOW_MINUTES:15}
app.limits.register-per-hour=${LIMIT_REGISTER_PER_HOUR:10}

# Global daily caps for all users together (rolling 24 hours). 0 turns a cap off. The admin is never blocked.
# A search costs about 6 Serper credits for Google Maps plus up to 10 for lookups.
app.caps.searches-per-day=${CAP_SEARCHES_PER_DAY:60}
app.caps.drafts-per-day=${CAP_DRAFTS_PER_DAY:300}
app.caps.enrich-per-day=${CAP_ENRICH_PER_DAY:100}

# Telegram: the bot that people connect their own chat to (messages when a search finishes), and the admin's chat for
# alerts when something breaks. Set them outside the code (environment variables). One bot per environment: only one
# running backend can read a bot's messages (TELEGRAM_POLLING=false turns reading off, for example on a second machine).
app.alerts.telegram-bot-token=${TELEGRAM_BOT_TOKEN:}
app.alerts.telegram-chat-id=${TELEGRAM_CHAT_ID:}
app.telegram.polling=${TELEGRAM_POLLING:true}

# Admin account: ADMIN_EMAIL and ADMIN_PASSWORD are used only to create it on the first start. After that the admin changes
# them in the app. ADMIN_PASSWORD_RESET=true applies them again at startup (to get back in when the password is lost).
app.admin.email=${ADMIN_EMAIL:}
app.admin.name=${ADMIN_NAME:}
app.admin.password=${ADMIN_PASSWORD:}
app.admin.password-reset=${ADMIN_PASSWORD_RESET:false}

# Demo access configuration
app.demo.enabled=${DEMO_ENABLED:true}
app.demo.max-sessions=${DEMO_MAX_SESSIONS:5}
app.demo.idle-minutes=${DEMO_IDLE_MINUTES:15}
app.demo.allow-registration=${DEMO_ALLOW_REGISTRATION:false}

# One-click guest accounts: deleted after the idle time above; smaller daily limits than a real account.
app.guest.enabled=${GUEST_ENABLED:true}
app.guest.searches-per-day=${GUEST_SEARCHES_PER_DAY:2}
app.guest.drafts-per-day=${GUEST_DRAFTS_PER_DAY:5}
app.guest.enrich-per-day=${GUEST_ENRICH_PER_DAY:2}
app.guest.per-ip-per-hour=${GUEST_PER_IP_PER_HOUR:5}

# Google sign-in: the client ID is public. Leave empty to turn Google sign-in off.
app.google.client-id=${GOOGLE_CLIENT_ID:605376343630-5bt8rvi8dhvdjvlj2tu3sauv34dou3j2.apps.googleusercontent.com}

