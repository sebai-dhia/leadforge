spring.application.name=backend
server.port=${PORT:8081}
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/leadfinder}
spring.datasource.username=${DB_USER:leadfinder}
spring.datasource.password=${DB_PASSWORD:leadfinder}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Must be at least 32 characters. Override in production.
app.jwt-secret=${JWT_SECRET:dev-only-secret-change-me-please-32chars}
app.cors-origin=${CORS_ORIGIN:http://localhost:4200}
app.n8n.webhook-url=${N8N_WEBHOOK_URL:http://localhost:5678/webhook/find-leads}
app.n8n.draft-url=${N8N_DRAFT_URL:http://localhost:5678/webhook/draft-message}
app.n8n.webhook-secret=${N8N_WEBHOOK_SECRET:dev-webhook-secret}
app.n8n.callback-secret=${N8N_CALLBACK_SECRET:dev-callback-secret}
# URL n8n uses to reach this backend (host.docker.internal if n8n runs in Docker)
app.public-base-url=${PUBLIC_BASE_URL:http://localhost:8081}

app.n8n.enrich-url=${N8N_ENRICH_URL:http://localhost:5678/webhook/enrich-contact}

# Usage limits. Daily limits are per user over a rolling 24 hours.
app.limits.searches-per-day=${LIMIT_SEARCHES_PER_DAY:20}
app.limits.drafts-per-day=${LIMIT_DRAFTS_PER_DAY:100}
app.limits.enrich-per-day=${LIMIT_ENRICH_PER_DAY:50}
# After this many failed logins from one address (or one address and email) the address is blocked for the window.
app.limits.login-failures=${LIMIT_LOGIN_FAILURES:5}
app.limits.login-window-minutes=${LIMIT_LOGIN_WINDOW_MINUTES:15}
app.limits.register-per-hour=${LIMIT_REGISTER_PER_HOUR:10}

# Demo access configuration
app.demo.enabled=${DEMO_ENABLED:true}
app.demo.max-sessions=${DEMO_MAX_SESSIONS:5}
app.demo.idle-minutes=${DEMO_IDLE_MINUTES:15}
app.demo.allow-registration=${DEMO_ALLOW_REGISTRATION:false}

