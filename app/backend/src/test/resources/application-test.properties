# Integration tests run against their own database in the same Postgres as development
# (docker compose up -d). TestDatabase creates it on first use.
spring.datasource.url=jdbc:postgresql://localhost:5433/leadfinder_test
spring.datasource.username=leadfinder
spring.datasource.password=leadfinder

# Small limits so the tests can reach them quickly
app.limits.searches-per-day=2
app.limits.drafts-per-day=2
app.limits.enrich-per-day=2
app.limits.login-failures=3
app.limits.login-window-minutes=15
app.limits.register-per-hour=3

app.n8n.webhook-url=http://localhost:1/never
app.n8n.draft-url=http://localhost:1/never
app.n8n.enrich-url=http://localhost:1/never
app.n8n.callback-secret=test-callback-secret
