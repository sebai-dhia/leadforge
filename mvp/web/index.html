<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lead Finder</title>
<style>
  :root { --bg:#f7f7f5; --card:#fff; --ink:#1c1c1a; --mute:#6b6b66; --line:#e3e3de; --accent:#2f5d50; --warn:#b45309; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#141413; --card:#1e1e1c; --ink:#ececE8; --mute:#9a9a93; --line:#33332f; --accent:#7fc4ad; --warn:#f0a85a; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.5 system-ui, sans-serif; }
  main { max-width: 880px; margin: 0 auto; padding: 32px 16px 64px; }
  h1 { font-size: 24px; margin: 0 0 4px; }
  .sub { color: var(--mute); margin: 0 0 24px; }
  form, .lead { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:16px; }
  .grid { display:grid; grid-template-columns: 1fr 1fr; gap:12px; }
  @media (max-width: 600px) { .grid { grid-template-columns: 1fr; } }
  label { display:block; font-size:13px; color:var(--mute); margin-bottom:4px; }
  input, textarea { width:100%; padding:9px 10px; border:1px solid var(--line); border-radius:6px; background:transparent; color:var(--ink); font:inherit; }
  textarea { resize: vertical; }
  .full { grid-column: 1 / -1; }
  button { font:inherit; padding:9px 14px; border-radius:6px; border:1px solid var(--accent); background:var(--accent); color:#fff; cursor:pointer; }
  @media (prefers-color-scheme: dark) { button { color:#0e1a16; } }
  button.ghost { background:transparent; color:var(--accent); }
  button:disabled { opacity:.5; cursor:wait; }
  #status { margin:16px 0; color:var(--mute); min-height:1.5em; }
  #status.err { color:var(--warn); }
  .lead { margin-bottom:12px; }
  .head { display:flex; justify-content:space-between; gap:12px; align-items:baseline; flex-wrap:wrap; }
  .name { font-weight:600; font-size:16px; }
  .score { font-weight:600; color:var(--accent); white-space:nowrap; }
  .meta { color:var(--mute); font-size:13px; margin:2px 0 8px; }
  .meta a { color:inherit; }
  .reason { margin:0 0 10px; }
  .actions { display:flex; gap:8px; margin-top:8px; flex-wrap:wrap; align-items:center; }
  .noemail { color:var(--warn); font-size:13px; }
  details { margin-top:6px; }
  summary { cursor:pointer; color:var(--mute); font-size:13px; }
</style>
</head>
<body>
<main>
  <h1>Lead Finder</h1>
  <p class="sub">Find local businesses that could need custom software, with a ready-to-review email for each.</p>

  <form id="f">
    <div class="grid">
      <div class="full">
        <label for="hook">n8n webhook URL</label>
        <input id="hook" required placeholder="http://localhost:5678/webhook/find-leads">
      </div>
      <div><label for="niche">Business type</label><input id="niche" required placeholder="dental clinics"></div>
      <div><label for="city">City</label><input id="city" required placeholder="Lyon"></div>
      <div class="full"><label for="service">What you offer</label>
        <textarea id="service" rows="2" required placeholder="Custom booking systems and internal tools for small businesses"></textarea></div>
      <div><label for="sender">Your name</label><input id="sender" required></div>
      <div style="align-self:end"><button id="go" type="submit">Find leads</button></div>
    </div>
  </form>

  <div id="status" role="status"></div>
  <div id="results"></div>
</main>

<script>
const $ = id => document.getElementById(id);
const KEYS = ['hook', 'niche', 'city', 'service', 'sender'];
const store = {
  get(k) { try { return localStorage.getItem(k) || ''; } catch { return ''; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} }
};
KEYS.forEach(k => { $(k).value = store.get('lf_' + k); });

function setStatus(msg, err) { $('status').textContent = msg; $('status').className = err ? 'err' : ''; }

function esc(s) { const d = document.createElement('div'); d.textContent = s ?? ''; return d.innerHTML; }

function render(leads) {
  $('results').innerHTML = '';
  leads.forEach((l, i) => {
    const to = (l.emails && l.emails[0]) || '';
    const el = document.createElement('div');
    el.className = 'lead';
    el.innerHTML = `
      <div class="head"><span class="name">${esc(l.name)}</span><span class="score">Fit ${esc(l.score)}/10</span></div>
      <div class="meta">${esc(l.address)} · <a href="${esc(l.website)}" target="_blank" rel="noopener">website</a>
        ${l.phone ? ' · ' + esc(l.phone) : ''}${l.rating ? ' · ★ ' + esc(l.rating) + ' (' + esc(l.reviews) + ')' : ''}</div>
      <p class="reason">${esc(l.reason)}</p>
      ${to ? `<div class="meta">Email found: ${esc(l.emails.join(', '))}</div>` : '<div class="noemail">No email found on the website. Try the contact form or phone.</div>'}
      <details><summary>Draft email</summary>
        <label style="margin-top:8px">Subject</label><input data-s="${i}" value="${esc(l.subject)}">
        <label style="margin-top:8px">Body</label><textarea data-b="${i}" rows="7">${esc(l.email_body)}</textarea>
        <div class="actions">
          <button type="button" data-copy="${i}" class="ghost">Copy</button>
          ${to ? `<button type="button" data-mail="${i}">Open in mail app</button>` : ''}
        </div>
      </details>`;
    $('results').appendChild(el);
  });
  $('results').onclick = e => {
    const c = e.target.dataset.copy, m = e.target.dataset.mail, i = c ?? m;
    if (i == null) return;
    const subj = document.querySelector(`[data-s="${i}"]`).value;
    const body = document.querySelector(`[data-b="${i}"]`).value;
    if (c != null) { navigator.clipboard.writeText(subj + '\n\n' + body); e.target.textContent = 'Copied'; }
    else location.href = `mailto:${leads[i].emails[0]}?subject=${encodeURIComponent(subj)}&body=${encodeURIComponent(body)}`;
  };
}

$('f').addEventListener('submit', async e => {
  e.preventDefault();
  KEYS.forEach(k => store.set('lf_' + k, $(k).value));
  $('go').disabled = true; $('results').innerHTML = '';
  setStatus('Searching and drafting emails. This takes about a minute…');
  try {
    const res = await fetch($('hook').value.trim(), {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ niche: $('niche').value, city: $('city').value, service: $('service').value, sender: $('sender').value })
    });
    if (!res.ok) throw new Error('n8n returned ' + res.status);
    const data = await res.json();
    if (!data.leads || !data.leads.length) { setStatus('No businesses with a website found. Try another niche or city.'); return; }
    setStatus(data.leads.length + ' leads, best fit first. Review each draft before sending.');
    render(data.leads);
  } catch (err) {
    setStatus('Failed: ' + err.message + '. Is the workflow active and the URL correct?', true);
  } finally { $('go').disabled = false; }
});
</script>
</body>
</html>
