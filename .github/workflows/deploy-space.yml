# Publishes a version to the Hugging Face Space: copies app/deploy/hf/Dockerfile there with this commit as GIT_REF,
# and the Space builds it (10 to 15 minutes; follow it in the Space's Logs tab).
# Runs on a pushed tag (git tag v0.2.0 && git push --follow-tags), or by hand from the Actions tab.
# Needs the repository secret HF_TOKEN (a Hugging Face write token) and variable HF_SPACE (owner/space-name).
name: Deploy to Hugging Face

on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency: deploy-space

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Push to the Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ vars.HF_SPACE }}
        run: |
          set -euo pipefail
          git clone --depth 1 "https://hf:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE}" space
          cp app/deploy/hf/Dockerfile space/Dockerfile
          sed -i "s/^ARG GIT_REF=.*/ARG GIT_REF=${GITHUB_SHA}/" space/Dockerfile
          host="${HF_SPACE,,}"; host="${host//[\/_.]/-}"
          sed "s/OWNER-SPACE/${host}/" app/deploy/hf/space-README.md > space/README.md
          cd space
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -m "Deploy ${GITHUB_REF_NAME} (${GITHUB_SHA::7})" || echo "Nothing changed"
          git push
          echo "Building at https://huggingface.co/spaces/${HF_SPACE}; the app will be at https://${host}.hf.space"
